# Puts main online on Vercel after every push, whoever made it.
#
# Why: on Vercel's free plan, Vercel's own Git deploy only builds commits whose
# author owns the Vercel account. Commits from teammates are blocked. This
# workflow deploys with the owner's token instead.
#
# Needs three repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       a token from vercel.com/account/tokens
#   VERCEL_ORG_ID      Vercel → Settings (account) → General → "Vercel ID" / Team ID
#   VERCEL_PROJECT_ID  Vercel → project → Settings → General → "Project ID"
# The app's own keys (Supabase, Google Maps, …) stay in Vercel's Environment
# Variables; "vercel pull" fetches them for the build.

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI: vercel@65.9.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fetch project settings and environment variables
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: npx --yes "$VERCEL_CLI" build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # Without .git the CLI sends no commit author, so Vercel's free plan
      # does not block the deployment when a teammate made the last commit.
      - name: Remove Git metadata
        run: rm -rf .git

      - name: Deploy
        run: npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
